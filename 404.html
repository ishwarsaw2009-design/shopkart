<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | ShopKart</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <header class="site-header">
    <div class="container">
      <div class="main-nav">
        <div class="nav-wrapper">
          <a href="index.html" class="brand-logo">
            <span class="logo-icon">🛍️</span>
            <div>
              <span>ShopKart</span>
              <span class="plus-tag">Explore Plus ✦</span>
            </div>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="text-align: center; padding: 80px 20px;">
    <div style="font-size: 100px; line-height: 1; margin-bottom: 20px;">🔍</div>
    <h1 style="font-family: var(--font-heading); font-size: 42px; font-weight: 800; margin-bottom: 12px;">404 - Page Not Found</h1>
    <p style="font-size: 16px; color: var(--text-muted); max-width: 500px; margin: 0 auto 30px;">
      Oops! The page or product you are looking for doesn't exist, has been removed, or is temporarily unavailable.
    </p>

    <div style="max-width: 450px; margin: 0 auto 30px;">
      <form onsubmit="event.preventDefault(); window.location.href='index.html';" class="search-input-group">
        <input type="text" placeholder="Search ShopKart for products..." required />
        <button type="submit">🔍 Search</button>
      </form>
    </div>

    <a href="index.html" class="btn-hero" style="display: inline-flex;">
      ← Return to ShopKart Homepage
    </a>
  </main>

  <footer class="site-footer" style="margin-top: 0;">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 ShopKart Inc. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

</body>
</html>
